services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/muamalah.db
      - DATA_DIR=/app/data
    volumes:
      - muamalah-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "find /app/data/health -mmin -5 2>/dev/null | grep -q . || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  muamalah-data:
